spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/version_4}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:31102005}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 3
      minimum-idle: 0
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 30000
      leak-detection-threshold: 60000
      validation-timeout: 5000
      initialization-fail-timeout: 60000
      auto-commit: false
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      username: ${SPRING_DATA_REDIS_USERNAME:}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      connect-timeout: ${SPRING_DATA_REDIS_CONNECT_TIMEOUT:10s}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:10s}

      ssl:
        enabled: ${SSL_ENABLED:false}
        disable-peer-verification: ${SPRING_DATA_REDIS_SSL_DISABLE_PEER_VERIFICATION:true}

      repositories:
        enabled: true

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:root}
    password: ${SPRING_RABBITMQ_PASSWORD:31102005}
    # Bổ sung 2 dòng dưới đây
    virtual-host: ${SPRING_RABBITMQ_VIRTUAL_HOST:/}
    ssl:
      enabled: ${SSL_ENABLED:false}

  threads:
    virtual:
      enabled: true

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    database: PostgreSQL
    show-sql: true
    open-in-view: true
    repositories:
      enabled: true
    defer-datasource-initialization: false
    properties:
      hibernate:
        generate_statistics: true
        jdbc:
          time_zone: Asia/Ho_Chi_Minh
          batch_size: 50
          order_updates: true
          order_inserts: true
          batch_versioned_data: true
        connection:
          provider_disables_autocommit: true
        query:
          plan_cache_max_size: 2048
          plan_parameter_metadata_max_size: 128

  #        temp:
  #          use_jdbc_metadata_defaults: false
  #        boot:
  #          allow_jdbc_metadata_access: false

  sql:
    init:
      mode: never

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  Jackson:
    time-zone: Asia/Ho_Chi_Minh

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:false}
    baseline-on-migrate: true
    baseline-version: 1

logging:
  level:
#      org.springframework.data.repository.config.RepositoryConfigurationExtensionSupport: ERROR
#      org.springframework.security: WARN
#      com.zaxxer.hikari: WARN
#      org.hibernate: WARN
#      org.postgresql: WARN
#      root: INFO
#      org.springframework.web: INFO

    root: INFO

    # 1.
    org.hibernate.SQL: OFF
    org.hibernate.type.descriptor.sql.BasicBinder: OFF

    # 2.
    org.hibernate.stat: ERROR
    org.hibernate.engine.internal.StatisticalLoggingSessionEventListener: INFO
    org.springframework.data.repository.config.RepositoryConfigurationExtensionSupport: ERROR

    # 3.
    org.springframework.web: DEBUG # Log các yêu cầu HTTP và phản hồi
    org.springframework.web.filter.CommonsRequestLoggingFilter: DEBUG
    org.springframework.security: WARN # Log các sự kiện liên quan đến bảo mật
    com.zaxxer.hikari: WARN # Log các sự kiện liên quan đến HikariCP
    org.postgresql: WARN

jwt:
  base64-secret: ${JWT_BASE64_SECRET}
  access-token-validity-in-seconds: ${JWT_ACCESS_TOKEN_VALIDITY_IN_SECONDS}
  refresh-token-validity-in-seconds: ${JWT_REFRESH_TOKEN_VALIDITY_IN_SECONDS}

firebase:
  config-base64: ${FIREBASE_CONFIG_BASE64:}

supabase:
  url: ${SUPABASE_URL}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY}
  storage:
    face-image-bucket: ${SUPABASE_FACE_IMAGE_BUCKET:face-images}
    max-file-size: ${SUPABASE_FACE_IMAGE_MAX_SIZE:5242880}

password:
  time_password_change_days: ${TIME_PASSWORD_CHANGE_DAYS}

cache:
  ttl:
    one-day-seconds: 86400
    one-week-seconds: 604800
    one-month-seconds: 2592000

bytescale:
  account-id: ${BYTESCALE_ACCOUNT_ID}
  api-key: ${BYTESCALE_API_KEY}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8000,https://taekwondovanquan.vercel.app,https://datnguyentrung-ai-receptionist-be.hf.space,https://b7v7xl4m-5173.asse.devtunnels.ms/, https://wscwpbx7-5173.asse.devtunnels.ms}

server:
  port: ${PORT:8080}
  address: 0.0.0.0
  tomcat:
    threads:
      max: ${SERVER_TOMCAT_THREADS_MAX:40}
      min-spare: ${SERVER_TOMCAT_THREADS_MIN_SPARE:5}

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

facebook:
  app-id: ${FACEBOOK_APP_ID}
  app-secret: ${FACEBOOK_APP_SECRET}
